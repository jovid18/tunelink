<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>TuneLink - Fast & Simple URL Shortener</title>
    <meta name="title" content="TuneLink - Fast & Simple URL Shortener" />
    <meta name="description" content="Shorten your long URLs into short, shareable links. Free, fast, and secure URL shortening service." />
    <meta name="keywords" content="URL shortener, link shortener, short URL, shorten link, tiny URL, free URL shortener" />
    <meta name="author" content="TuneLink" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tunelink.io/" />
    <meta property="og:title" content="TuneLink - Fast & Simple URL Shortener" />
    <meta property="og:description" content="Shorten your long URLs into short, shareable links. Free, fast, and secure URL shortening service." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="TuneLink" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tunelink.io/" />
    <meta name="twitter:title" content="TuneLink - Fast & Simple URL Shortener" />
    <meta name="twitter:description" content="Shorten your long URLs into short, shareable links. Free, fast, and secure URL shortening service." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="msapplication-TileColor" content="#7c3aed" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://tunelink.io/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
