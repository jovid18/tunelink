services:
  mysql:
    image: mysql:8.0
    container_name: tunelink-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tunelink
      MYSQL_USER: tunelink
      MYSQL_PASSWORD: tunelink
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tunelink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    container_name: tunelink-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: tunelink
      DB_PASSWORD: tunelink
      DB_NAME: tunelink
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BASE_URL: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    container_name: tunelink-web
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
